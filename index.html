<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Add Link</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .admin-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007AFF;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #005bb5;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="admin-card">
        <h2>Update Photos Link</h2>
        <input type="text" id="title-input" placeholder="Enter Video Title (e.g. My Vacation)">
        <input type="text" id="thumb-input" placeholder="Paste Thumbnail Image URL (Optional)">
        <input type="text" id="link-input" placeholder="Paste Google Photos URL here">
        <button id="save-btn">Save to Firestore</button>
        <p id="status"></p>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAy-7QGZ05wNf0fLG1-AY2FxJy_fdILdoM",
            authDomain: "quizifyapp-4c5ca.firebaseapp.com",
            projectId: "quizifyapp-4c5ca",
            storageBucket: "quizifyapp-4c5ca.firebasestorage.app",
            messagingSenderId: "948606346917",
            appId: "1:948606346917:web:ab385f7753da5c20710f4c",
            measurementId: "G-C8BJ139KHE"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('save-btn').addEventListener('click', async () => {
            const urlInput = document.getElementById('link-input').value;
            const titleInput = document.getElementById('title-input').value;
            const thumbInput = document.getElementById('thumb-input').value;
            const statusEl = document.getElementById('status');
            
            if (!urlInput || !titleInput) {
                statusEl.style.color = "red";
                statusEl.innerText = "Please enter both a title and a valid link!";
                return;
            }

            statusEl.style.color = "black";
            statusEl.innerText = "Saving...";

            try {
                // Add a new document to the "shared_links" collection
                await addDoc(collection(db, "shared_links"), {
                    title: titleInput,
                    thumbnailUrl: thumbInput || "https://via.placeholder.com/350x200.png?text=Play+Video",
                    url: urlInput,
                    timestamp: serverTimestamp() // Keeps track of when it was added
                });
                statusEl.style.color = "green";
                statusEl.innerText = "Link successfully saved to database!";
                document.getElementById('title-input').value = ""; // clear input
                document.getElementById('thumb-input').value = ""; // clear input
                document.getElementById('link-input').value = ""; // clear input
            } catch (error) {
                console.error("Error adding document: ", error);
                statusEl.style.color = "red";
                statusEl.innerText = "Error saving link. Check console for details.";
            }
        });
    </script>
</body>
</html>
