<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Video Uploader</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            scroll-behavior: smooth;
            margin: 0;
            color: #334155;
        }

        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .dashboard-header {
            margin-bottom: 40px;
        }

        .dashboard-header h1 {
            margin: 0 0 8px;
            font-size: 32px;
            color: #0f172a;
        }

        .dashboard-header p {
            margin: 0;
            color: #64748b;
            font-size: 16px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 30px;
            align-items: start;
        }

        .panel {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2e8f0;
        }

        .form-panel {
            position: sticky;
            top: 40px;
        }

        .panel-title {
            font-size: 20px;
            color: #0f172a;
            margin-top: 0;
            margin-bottom: 24px;
            font-weight: 700;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 25px;
        }

        .input-field {
            position: relative;
        }

        .input-field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #475569;
        }

        input[type="text"] {
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            width: 100%;
            box-sizing: border-box;
            background-color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }

        input[type="text"]:focus, input[type="text"]:hover {
            border-color: #3b82f6;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        select {
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            width: 100%;
            background-color: #f8fafc;
        }

        button {
            width: 100%;
            padding: 16px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover:not(:disabled) {
            background-color: #2563eb;
            transform: translateY(-1px);
        }

        button:disabled {
            background-color: #93c5fd;
            cursor: not-allowed;
        }

        /* Custom Status Messages instead of Alerts */
        .status-msg {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
        }
        .status-msg.success {
            display: block;
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        .status-msg.error {
            display: block;
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        /* Video List Styles */
        .video-list {
            display: flex;
            flex-direction: column;
        }

        .video-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0;
            border-bottom: 1px solid #f1f5f9;
            transition: background-color 0.2s;
        }

        .video-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .video-item:first-child {
            padding-top: 0;
        }

        .video-info {
            display: flex;
            align-items: center;
            gap: 20px;
            flex: 1;
            min-width: 0;
        }

        .video-info img {
            width: 120px;
            height: 68px;
            object-fit: cover;
            border-radius: 6px;
            background-color: #e2e8f0;
            border: 1px solid #e2e8f0;
        }

        .video-details {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .video-title {
            font-weight: 700;
            color: #1e293b;
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .platform-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            margin-top: 8px;
            align-self: flex-start;
        }

        .platform-badge.youtube { background: #fee2e2; color: #dc2626; }
        .platform-badge.drive { background: #dbeafe; color: #2563eb; }
        .platform-badge.study { background: #fef08a; color: #854d0e; }
        .platform-badge.entertainment { background: #e9d5ff; color: #7e22ce; }
        .platform-badge.views { background: #e2e8f0; color: #475569; }
        .platform-badge.image { background: #d1fae5; color: #059669; }
        .platform-badge.photos { background: #fce7f3; color: #db2777; }
        .platform-badge.other { background: #f3f4f6; color: #4b5563; }
        .platform-badge.video { background: #e0e7ff; color: #4338ca; }

        .video-actions {
            display: flex;
            gap: 10px;
            margin-left: 20px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            font-size: 13px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s;
        }

        .btn-edit { background-color: #e0f2fe; color: #2563eb; }
        .btn-edit:hover { background-color: #bfdbfe; }
        .btn-delete { background-color: #fee2e2; color: #dc2626; }
        .btn-delete:hover { background-color: #fecaca; }

        .cancel-edit-btn {
            display: none;
            background-color: transparent;
            color: #64748b;
            border: 1px solid #cbd5e1;
            margin-top: 10px;
        }
        .cancel-edit-btn:hover:not(:disabled) {
            background-color: #f1f5f9;
            color: #334155;
        }

        @media (max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            .form-panel {
                position: static;
            }
            .video-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
            .video-info {
                width: 100%;
            }
            .video-actions {
                width: 100%;
                justify-content: flex-end;
                margin-left: 0;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <header class="dashboard-header">
            <h1>Admin Dashboard</h1>
            <p>Manage your streaming platform content</p>
        </header>

        <div class="dashboard-grid">
            <!-- Form Panel -->
            <aside class="panel form-panel">
                <h2 class="panel-title" id="formTitle">Upload New Media</h2>
                
                <div id="statusMsg" class="status-msg"></div>
        
                <div class="input-group">
                    <div class="input-field">
                        <label for="vidTitle">Media Title</label>
                        <input type="text" id="vidTitle" placeholder="e.g. My Awesome Video">
                    </div>
                    <div class="input-field" id="thumbField">
                        <label for="vidThumb">Thumbnail URL</label>
                        <input type="text" id="vidThumb" placeholder="e.g. https://example.com/image.jpg">
                    </div>
                    <div class="input-field">
                        <label for="vidCategory">Category</label>
                        <select id="vidCategory">
                            <option value="entertainment">Entertainment</option>
                            <option value="study">Study</option>
                        </select>
                    </div>
                    <div class="input-field">
                        <label for="vidMediaType">Media Type</label>
                        <select id="vidMediaType">
                            <option value="video">Video</option>
                            <option value="image">Image</option>
                        </select>
                    </div>
                    <div class="input-field">
                        <label for="driveLink">Media Link (YouTube, Drive, Photos, or Image URL)</label>
                        <input type="text" id="driveLink" placeholder="Paste link here">
                    </div>
                </div>
                
                <button id="addBtn">Publish Media</button>
                <button id="cancelBtn" class="cancel-edit-btn">Cancel Edit</button>
            </aside>

            <!-- List Panel -->
            <div>
                <main class="panel list-panel">
                    <h2 class="panel-title">Manage Uploaded Videos</h2>
                    <div class="video-list" id="videoList"></div>
                </main>

                <aside class="panel" style="margin-top: 30px;">
                    <h2 class="panel-title">Manage Featured Links</h2>
                    <p style="font-size: 14px; color: #64748b; margin-top: -20px; margin-bottom: 24px;">Add special highlighted links that appear at the top of the app.</p>
                    <div id="shareLinkStatusMsg" class="status-msg"></div>
                    <div class="input-group">
                        <div class="input-field">
                            <label for="featTitle">Link Title</label>
                            <input type="text" id="featTitle" placeholder="e.g. Special Announcement">
                        </div>
                        <div class="input-field">
                            <label for="featCategory">Category</label>
                            <select id="featCategory">
                                <option value="entertainment">Entertainment</option>
                                <option value="study">Study</option>
                            </select>
                        </div>
                        <div class="input-field">
                            <label for="shareableLink">Video/Photo URL</label>
                            <input type="text" id="shareableLink" placeholder="Paste any URL here">
                        </div>
                    </div>
                    <button id="saveShareLinkBtn">Add Featured Link</button>
                    <div id="featuredList" style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px;"></div>
                </aside>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAy-7QGZ05wNf0fLG1-AY2FxJy_fdILdoM",
            authDomain: "quizifyapp-4c5ca.firebaseapp.com",
            projectId: "quizifyapp-4c5ca",
            storageBucket: "quizifyapp-4c5ca.firebasestorage.app",
            messagingSenderId: "948606346917",
            appId: "1:948606346917:web:ab385f7753da5c20710f4c",
            measurementId: "G-C8BJ139KHE"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const addBtn = document.getElementById('addBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const statusMsg = document.getElementById('statusMsg');
        const videoList = document.getElementById('videoList');
        let currentEditId = null; // Tracks if we are editing an existing video

        function showStatus(message, isError = false) {
            statusMsg.textContent = message;
            statusMsg.className = `status-msg ${isError ? 'error' : 'success'}`;
            
            // Auto-hide the message after 4 seconds
            setTimeout(() => {
                statusMsg.style.display = 'none';
                statusMsg.className = 'status-msg';
            }, 4000);
        }

        function enterEditMode(id, title, thumbnail, originalLink, category, mediaType) {
            currentEditId = id;
            document.getElementById('formTitle').textContent = "Edit Media";
            document.getElementById('vidTitle').value = title;
            document.getElementById('vidThumb').value = thumbnail;
            document.getElementById('vidCategory').value = category || 'entertainment';
            document.getElementById('driveLink').value = originalLink;
            document.getElementById('vidMediaType').value = mediaType || 'video';
            addBtn.textContent = 'Update Media';
            cancelBtn.style.display = 'block';
            
            if ((mediaType || 'video') === 'image') {
                document.getElementById('thumbField').style.display = 'none';
            } else {
                document.getElementById('thumbField').style.display = 'block';
            }

            // Scroll up to top of page
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function exitEditMode() {
            currentEditId = null;
            document.getElementById('formTitle').textContent = "Upload New Media";
            document.querySelectorAll('input').forEach(input => input.value = '');
            document.getElementById('vidMediaType').value = 'video';
            addBtn.textContent = 'Publish Media';
            cancelBtn.style.display = 'none';
            
            document.getElementById('thumbField').style.display = 'block';
        }

        // Toggle fields based on Media Type selection
        document.getElementById('vidMediaType').addEventListener('change', (e) => {
            const thumbField = document.getElementById('thumbField');
            if (e.target.value === 'image') {
                thumbField.style.display = 'none';
            } else {
                thumbField.style.display = 'block';
            }
        });

        addBtn.addEventListener('click', async () => {
            const title = document.getElementById('vidTitle').value.trim();
            let thumbnail = document.getElementById('vidThumb').value.trim();
            const category = document.getElementById('vidCategory').value;
            const inputUrl = document.getElementById('driveLink').value.trim();
            const mediaType = document.getElementById('vidMediaType').value;

            if (!title || (!thumbnail && mediaType !== 'image') || !inputUrl) {
                return showStatus("Please fill in all fields.", true);
            }

            // Set loading state
            addBtn.disabled = true;
            addBtn.textContent = currentEditId ? 'Updating...' : 'Publishing...';

            try {
                let videoId = inputUrl;
                let platform = 'other';
                
                // 1. Check if it's a YouTube link
                const ytMatch = inputUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
                const driveMatch = inputUrl.match(/(?:id=|file\/d\/)([\w-]+)/);
                
                if (ytMatch) {
                    videoId = ytMatch[1];
                    platform = 'youtube';
                } else if (driveMatch) {
                    videoId = driveMatch[1];
                    platform = 'drive';
                } else if (inputUrl.includes('photos.app.goo.gl') || inputUrl.includes('photos.google.com')) {
                    platform = 'photos';
                } else if (inputUrl.match(/\.(jpeg|jpg|gif|png|webp)$/i)) {
                    platform = 'image';
                }
                
                if (mediaType === 'image') {
                    // If it's a Google Photos/Drive link, use a default image gallery placeholder to prevent 403 errors
                    const isDirectImage = platform === 'image' || inputUrl.match(/\.(jpeg|jpg|gif|png|webp.*)$/i);
                    thumbnail = isDirectImage ? inputUrl : 'https://images.unsplash.com/photo-1611162617474-5b21e879e113?q=80&w=500&auto=format&fit=crop';
                }

                const videoData = { title, thumbnail, videoId, platform, driveVideoId: platform === 'drive' ? videoId : null, category, mediaType };

                if (currentEditId) {
                    // Update existing video
                    await updateDoc(doc(db, "videos", currentEditId), videoData);
                    showStatus("Media Updated Successfully!");
                    exitEditMode();
                } else {
                    // Add new video
                    await addDoc(collection(db, "videos"), { ...videoData, createdAt: Date.now(), views: 0 });
                    showStatus("Media Published Successfully!");
                    document.querySelectorAll('input').forEach(input => input.value = '');
                }
            } catch (e) {
                showStatus(e.message, true);
            } finally {
                // Reset button state
                addBtn.disabled = false;
                addBtn.textContent = currentEditId ? 'Update Media' : 'Publish Media';
            }
        });

        cancelBtn.addEventListener('click', exitEditMode);

        // --- Featured Links Logic ---
        const featTitleInput = document.getElementById('featTitle');
        const featCategoryInput = document.getElementById('featCategory');
        const shareableLinkInput = document.getElementById('shareableLink');
        const saveShareLinkBtn = document.getElementById('saveShareLinkBtn');
        const shareLinkStatusMsg = document.getElementById('shareLinkStatusMsg');
        const featuredList = document.getElementById('featuredList');

        function showShareLinkStatus(message, isError = false) {
            shareLinkStatusMsg.textContent = message;
            shareLinkStatusMsg.className = `status-msg ${isError ? 'error' : 'success'}`;
            setTimeout(() => {
                shareLinkStatusMsg.style.display = 'none';
                shareLinkStatusMsg.className = 'status-msg';
            }, 4000);
        }

        saveShareLinkBtn.addEventListener('click', async () => {
            const title = featTitleInput.value.trim();
            const category = featCategoryInput.value;
            const url = shareableLinkInput.value.trim();
            
            if (!title || !url) {
                return showShareLinkStatus("Please enter both a Title and URL.", true);
            }

            saveShareLinkBtn.disabled = true;
            saveShareLinkBtn.textContent = 'Adding...';

            try {
                await addDoc(collection(db, "featured_links"), {
                    title: title,
                    category: category,
                    url: url,
                    timestamp: Date.now()
                });
                showShareLinkStatus("Featured link added successfully!");
                featTitleInput.value = '';
                shareableLinkInput.value = '';
            } catch (e) {
                showShareLinkStatus("Error adding link: " + e.message, true);
            } finally {
                saveShareLinkBtn.disabled = false;
                saveShareLinkBtn.textContent = 'Add Featured Link';
            }
        });

        // Fetch and display featured links list
        onSnapshot(query(collection(db, "featured_links"), orderBy("timestamp", "desc")), (snapshot) => {
            featuredList.innerHTML = '';
            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                const div = document.createElement('div');
                div.style.cssText = "display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0;";
                div.innerHTML = `
                    <div style="overflow: hidden; padding-right: 10px;">
                        <div style="font-weight: 600; font-size: 14px; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${data.title}</div>
                        <div style="font-size: 12px; color: #64748b; margin-top: 4px;"><span style="text-transform: capitalize; font-weight: 600; color: #3b82f6;">${data.category}</span> • <a href="${data.url}" target="_blank" style="color: #64748b;">Link</a></div>
                    </div>
                    <button class="action-btn btn-delete" style="padding: 6px 10px; width: auto; font-size: 12px;">Delete</button>
                `;
                div.querySelector('button').addEventListener('click', async () => {
                    if(confirm(`Remove featured link "${data.title}"?`)) {
                        await deleteDoc(doc(db, "featured_links", docSnap.id));
                    }
                });
                featuredList.appendChild(div);
            });
        });

        // Fetch and display uploaded videos
        const q = query(collection(db, "videos"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            videoList.innerHTML = '';
            
            if (snapshot.empty) {
                videoList.innerHTML = '<p style="text-align:center; color:#64748b; font-size:14px;">No videos uploaded yet.</p>';
                return;
            }

            snapshot.forEach((videoDoc) => {
                const data = videoDoc.data();
                const id = videoDoc.id;
                
                // Reconstruct the original link so it can be edited
                const originalLink = data.platform === 'youtube' 
                    ? `https://youtu.be/${data.videoId}`
                    : data.platform === 'drive'
                        ? `https://drive.google.com/file/d/${data.driveVideoId || data.videoId}/view`
                        : data.videoId;

                const item = document.createElement('div');
                item.className = 'video-item';
                item.innerHTML = `
                    <div class="video-info">
                        <img src="${data.thumbnail}" alt="Thumbnail" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1611162617474-5b21e879e113?q=80&w=500&auto=format&fit=crop';">
                        <div class="video-details">
                            <span class="video-title">${data.title}</span>
                            <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                                <span class="platform-badge ${data.platform}">${data.platform}</span>
                                <span class="platform-badge ${data.mediaType || 'video'}">${(data.mediaType || 'video').toUpperCase()}</span>
                                <span class="platform-badge ${data.category || 'entertainment'}">${data.category === 'study' ? 'Study' : 'Entertainment'}</span>
                                <span class="platform-badge views">👁 ${data.views || 0} Views</span>
                            </div>
                        </div>
                    </div>
                    <div class="video-actions">
                        <button class="action-btn btn-edit" title="Edit">
                            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                            </svg>
                            Edit
                        </button>
                        <button class="action-btn btn-delete" title="Delete">
                            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            </svg>
                            Delete
                        </button>
                    </div>
                `;

                item.querySelector('.btn-edit').addEventListener('click', () => {
                    enterEditMode(id, data.title, data.thumbnail, originalLink, data.category, data.mediaType);
                });

                item.querySelector('.btn-delete').addEventListener('click', async () => {
                    if (confirm(`Are you sure you want to delete "${data.title}"? This cannot be undone.`)) {
                        try {
                            await deleteDoc(doc(db, "videos", id));
                            showStatus("Video deleted successfully!");
                        } catch (e) {
                            showStatus("Error deleting video: " + e.message, true);
                        }
                    }
                });

                videoList.appendChild(item);
            });
        });
    </script>
</body>
</html>
